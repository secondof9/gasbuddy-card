name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'
version-template: '$MAJOR.$MINOR.$PATCH'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
sort-direction: ascending

categories:
  # 1. Version Resolver Categories (New Schema)
  - type: "version-resolver"
    when:
      labels:
        - 'breaking-change'
        - 'breaking change'
    semver-increment: 'major'

  - type: "version-resolver"
    when:
      labels:
        - 'feature'
        - 'enhancement'
    semver-increment: 'minor'

  - type: "version-resolver"
    when:
      labels:
        - 'bug'
        - 'fix'
        - 'performance'
        - 'refactor'
        - 'style'
        - 'build'
        - 'chore'
        - 'documentation'
        - 'ci'
        - 'test'
        - 'dependencies'
    semver-increment: 'patch'

  - type: "version-resolver"
    semver-increment: 'patch' # Default fallback

  # 2. Changelog Grouping Categories (Updated 'when' syntax)
  - title: '✨ Enhancements'
    when:
      labels:
        - 'enhancement'

  - title: '🚀 Features'
    when:
      labels:
        - 'feature'
        - 'feat'

  - title: '🐛 Bug Fixes'
    when:
      labels:
        - 'fix'
        - 'bug'

  - title: '⚡ Performance'
    when:
      labels:
        - 'performance'

  - title: '📖 Documentation'
    collapse-after: 1
    when:
      labels:
        - 'docs'
        - 'documentation'

  - title: '🧰 Maintenance'
    collapse-after: 1
    when:
      labels:
        - 'chore'
        - 'refactor'
        - 'ci'

  - title: '📦 Dependencies'
    collapse-after: 1
    when:
      labels:
        - 'dependencies'

autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\\(.+\\))?:/i'
  - label: 'fix'
    title:
      - '/^fix(\\(.+\\))?:/i'
  - label: 'documentation'
    title:
      - '/^docs(\\(.+\\))?:/i'
  - label: 'chore'
    title:
      - '/^chore(\\(.+\\))?:/i'
  - label: 'refactor'
    title:
      - '/^refactor(\\(.+\\))?:/i'
  - label: 'ci'
    title:
      - '/^ci(\\(.+\\))?:/i'
      - '/^build(\\(.+\\))?:/i'
  - label: 'performance'
    title:
      - '/^perf(\\(.+\\))?:/i'
  - label: 'chore'
    title:
      - '/^style(\\(.+\\))?:/i'
      - '/^test(\\(.+\\))?:/i'
  - label: 'dependencies'
    title:
      - '/^build\\(deps\\)(\\(.+\\))?:/i'
      - '/^deps(\\(.+\\))?:/i'

template: |
  ## Changes
  $CHANGES
